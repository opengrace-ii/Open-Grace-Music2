<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rounded App Badge Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1E251B" />
      <stop offset="55%" stop-color="#141812" />
      <stop offset="100%" stop-color="#0C0E0B" />
    </radialGradient>

    <!-- Obsidian Vinyl Disc Gradient -->
    <radialGradient id="vinylGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#232820" />
      <stop offset="35%" stop-color="#141713" />
      <stop offset="70%" stop-color="#1B2019" />
      <stop offset="92%" stop-color="#10120F" />
      <stop offset="100%" stop-color="#090B09" />
    </radialGradient>

    <!-- Vinyl Angular Sheen Reflection -->
    <linearGradient id="vinylSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8D99E" stop-opacity="0.0" />
      <stop offset="42%" stop-color="#B8D99E" stop-opacity="0.03" />
      <stop offset="50%" stop-color="#E6D39A" stop-opacity="0.18" />
      <stop offset="58%" stop-color="#B8D99E" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#B8D99E" stop-opacity="0.0" />
    </linearGradient>

    <!-- Center Label Warm Golden-Sage Gradient -->
    <radialGradient id="labelGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E8D8A0" />
      <stop offset="45%" stop-color="#B8D99E" />
      <stop offset="80%" stop-color="#6F9459" />
      <stop offset="100%" stop-color="#2D3B26" />
    </radialGradient>

    <!-- Vintage Brass & Golden-Sage Gramophone Horn Gradient -->
    <linearGradient id="hornBellGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#F6E7B2" />
      <stop offset="32%" stop-color="#D4B86A" />
      <stop offset="68%" stop-color="#B8D99E" />
      <stop offset="100%" stop-color="#5B7349" />
    </linearGradient>

    <!-- Horn Interior Depth -->
    <radialGradient id="hornInsideGrad" cx="40%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#11140F" />
      <stop offset="48%" stop-color="#2A3321" />
      <stop offset="82%" stop-color="#8A763E" />
      <stop offset="100%" stop-color="#DEC67E" />
    </radialGradient>

    <!-- Brass Tonearm Gradient -->
    <linearGradient id="brassArmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E3AD" />
      <stop offset="50%" stop-color="#C8AF62" />
      <stop offset="100%" stop-color="#687D56" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Outer Rounded Badge Frame -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#394532" stroke-width="6" />
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="#B8D99E" stroke-opacity="0.16" stroke-width="2" />

  <!-- Subtle Corner Turntable Plinth Accents -->
  <circle cx="64" cy="448" r="10" fill="#252D21" stroke="#B8D99E" stroke-opacity="0.45" stroke-width="2" />
  <circle cx="64" cy="64" r="8" fill="#252D21" stroke="#B8D99E" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- GRAMOPHONE VINYL DISC (Centered slightly bottom-left to balance ornate horn) -->
  <g transform="translate(238, 274)" filter="url(#dropShadow)">
    <!-- Outer Rim Highlight -->
    <circle cx="0" cy="0" r="186" fill="url(#vinylGrad)" stroke="#B8D99E" stroke-opacity="0.55" stroke-width="3.5" />
    <circle cx="0" cy="0" r="181" fill="none" stroke="#E8D8A0" stroke-opacity="0.22" stroke-width="1.2" />

    <!-- Diagonal Vinyl Sheen -->
    <circle cx="0" cy="0" r="182" fill="url(#vinylSheen)" />

    <!-- Concentric Audiophile Golden-Sage Micro-Grooves -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="#B8D99E" stroke-opacity="0.18" stroke-width="1.2" />
    <circle cx="0" cy="0" r="158" fill="none" stroke="#E8D8A0" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="140 18 90 18" />
    <circle cx="0" cy="0" r="146" fill="none" stroke="#B8D99E" stroke-opacity="0.22" stroke-width="1.3" />
    <circle cx="0" cy="0" r="134" fill="none" stroke="#B8D99E" stroke-opacity="0.14" stroke-width="1" />
    <circle cx="0" cy="0" r="122" fill="none" stroke="#E8D8A0" stroke-opacity="0.20" stroke-width="1.2" stroke-dasharray="110 22 80 22" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#B8D99E" stroke-opacity="0.25" stroke-width="1.4" />
    <circle cx="0" cy="0" r="98" fill="none" stroke="#B8D99E" stroke-opacity="0.16" stroke-width="1" />
    <circle cx="0" cy="0" r="86" fill="none" stroke="#E8D8A0" stroke-opacity="0.25" stroke-width="1.2" />

    <!-- Light Reflection Arcs on Vinyl -->
    <path d="M -132 -95 A 162 162 0 0 1 -58 -151" fill="none" stroke="#F6E7B2" stroke-opacity="0.32" stroke-width="4" stroke-linecap="round" />
    <path d="M -105 -75 A 128 128 0 0 1 -45 -119" fill="none" stroke="#B8D99E" stroke-opacity="0.28" stroke-width="3" stroke-linecap="round" />
    <path d="M 132 95 A 162 162 0 0 1 58 151" fill="none" stroke="#F6E7B2" stroke-opacity="0.28" stroke-width="4" stroke-linecap="round" />
    <path d="M 105 75 A 128 128 0 0 1 45 119" fill="none" stroke="#B8D99E" stroke-opacity="0.24" stroke-width="3" stroke-linecap="round" />

    <!-- Center Gramophone Record Label -->
    <circle cx="0" cy="0" r="68" fill="url(#labelGrad)" stroke="#F6E7B2" stroke-width="3" />
    <circle cx="0" cy="0" r="57" fill="none" stroke="#141812" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="8 5" />
    <circle cx="0" cy="0" r="46" fill="#171D15" fill-opacity="0.28" stroke="#F6E7B2" stroke-opacity="0.5" stroke-width="1" />

    <!-- Label Cardinal Accents (Make rotation visually unmistakable) -->
    <circle cx="0" cy="-51" r="3.5" fill="#141812" />
    <circle cx="51" cy="0" r="3.5" fill="#141812" />
    <circle cx="0" cy="51" r="3.5" fill="#141812" />
    <circle cx="-51" cy="0" r="3.5" fill="#141812" />
    <path d="M -26 -28 Q 0 -42 26 -28" fill="none" stroke="#141812" stroke-opacity="0.7" stroke-width="2.2" stroke-linecap="round" />
    <path d="M -22 30 Q 0 40 22 30" fill="none" stroke="#141812" stroke-opacity="0.7" stroke-width="2.2" stroke-linecap="round" />

    <!-- Center Spindle Hole -->
    <circle cx="0" cy="0" r="15" fill="#0F120E" stroke="#F6E7B2" stroke-width="3" />
    <circle cx="0" cy="0" r="6" fill="#B8D99E" fill-opacity="0.7" />
  </g>

  <!-- ORNATE VINTAGE GRAMOPHONE HORN, ACOUSTIC NECK & TONEARM STYLUS -->
  <g filter="url(#dropShadow)">
    <!-- Pivot Base Turntable Mount (Top-Right / Right Edge) -->
    <circle cx="430" cy="212" r="26" fill="#1A2017" stroke="url(#brassArmGrad)" stroke-width="4" />
    <circle cx="430" cy="212" r="14" fill="url(#brassArmGrad)" />
    <circle cx="430" cy="212" r="5" fill="#11140F" />

    <!-- Curved Gramophone Acoustic Neck Tube -->
    <path
      d="M 430 212 C 454 185, 452 132, 412 108 C 388 94, 355 96, 330 112"
      fill="none"
      stroke="url(#brassArmGrad)"
      stroke-width="16"
      stroke-linecap="round"
    />
    <path
      d="M 430 212 C 454 185, 452 132, 412 108 C 388 94, 355 96, 330 112"
      fill="none"
      stroke="#F8EBC2"
      stroke-opacity="0.45"
      stroke-width="4"
      stroke-linecap="round"
    />

    <!-- Flared Morning-Glory Gramophone Horn Bell -->
    <path
      d="M 340 105 C 310 72, 265 44, 212 40 C 175 78, 178 148, 224 188 C 272 178, 318 144, 340 105 Z"
      fill="url(#hornBellGrad)"
      stroke="#F6E7B2"
      stroke-width="3"
      stroke-linejoin="round"
    />

    <!-- Gramophone Horn Mouth (Scalloped Brass Acoustic Opening) -->
    <ellipse
      cx="212"
      cy="115"
      rx="46"
      ry="74"
      transform="rotate(-14 212 115)"
      fill="url(#hornInsideGrad)"
      stroke="#F6E7B2"
      stroke-width="4.5"
    />

    <!-- Ornate Acoustic Ribs Inside & On Horn Bell -->
    <path d="M 332 106 C 292 84, 254 68, 206 62" fill="none" stroke="#F6E7B2" stroke-opacity="0.55" stroke-width="2" />
    <path d="M 334 110 C 290 112, 250 114, 185 115" fill="none" stroke="#F6E7B2" stroke-opacity="0.5" stroke-width="2" />
    <path d="M 330 115 C 292 138, 258 156, 218 168" fill="none" stroke="#F6E7B2" stroke-opacity="0.55" stroke-width="2" />

    <!-- Soundwaves Radiating from Gramophone Horn -->
    <path d="M 148 86 A 58 58 0 0 0 142 146" fill="none" stroke="#B8D99E" stroke-opacity="0.75" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 124 70 A 86 86 0 0 0 116 160" fill="none" stroke="#E8D8A0" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" />

    <!-- Tonearm & Stylus Needle Riding on Vinyl Grooves -->
    <path
      d="M 430 212 L 392 316 L 336 346"
      fill="none"
      stroke="url(#brassArmGrad)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Stylus Headshell Cartridge -->
    <g transform="translate(332, 348) rotate(-28)">
      <rect x="-18" y="-9" width="28" height="18" rx="5" fill="#1E251B" stroke="#F6E7B2" stroke-width="2.5" />
      <circle cx="-14" cy="0" r="4" fill="#B8D99E" />
      <!-- Glowing Needle Point Contacting Groove -->
      <circle cx="-22" cy="2" r="5" fill="#E8D8A0" fill-opacity="0.35" />
      <circle cx="-22" cy="2" r="2.2" fill="#FFF7D6" />
    </g>
  </g>
</svg>
